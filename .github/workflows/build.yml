# Version 1.1 - baut die Debug-APK von KidLock und legt sie zusaetzlich in den Branch apk-build
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kidlock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to branch apk-build
        run: |
          mkdir /tmp/apk
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app-debug.apk
          git commit -q -m "Debug APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
